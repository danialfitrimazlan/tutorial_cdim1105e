<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Link Style</title>

	<h4>Link Style</h4>

	<style>
		a:link, a:visited
		{
			color: yellow;
			background-color: darkblue;
			text-decoration: none;
		}
		a:hover, a:active
		{
			color: darkblue;
			background-color: red;
			text-decoration: underline;
		}
	</style>

</head>
<body>

	<a href="https://kelantan.uitm.edu.my/index.php/en/">Visit UiTM Kelantan</a>

</body>
</html>
