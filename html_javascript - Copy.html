<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HTML Javascripts</title>

	

</head>
<body>

<h2>Javascripts change content</h2>
	<p id="abc123">I am using Javascripts to change this content</p>

	<button type="button" onclick='document.getElementById("abc123").innerHTML="This is my second sentence. I use Javascripts to change here"'> CLICK HERE</button>

	<h2>Javascripts change the style</h2>

	<p id="denz">I am using Javascripts to change the style of this content </p>

	<script>
		function Mystyle() 
		{
			document.getElementById("denz").style.fontSize="55px";
			document.getElementById("denz").style.color="blue";
			document.getElementById("denz").style.fontFamily="Lucida";
			document.getElementById("denz").style.backgroundColor="grey";
		}
	</script>

	<button type="button" onclick="Mystyle()">CLICK ME</button>

	<script>
		function gambar(a)
		{
			var pict;
			if(a==1)
			{
				pict="images/night nature.jpeg"
			}
			else
			{
				pict="images/naruto.jpeg"
			}
			document.getElementById('gambar').src=pict;

		}
	</script>

	<h3>Javascripts do Image Manipulation</h3>
	<img src="images/night nature.jpeg" width="200" height="200" id="gambar">

	<p>
		<button type="button" onclick="gambar(1)">Picture a</button>
		<button type="button" onclick="gambar(3)">Picture b</button>
	</p>
